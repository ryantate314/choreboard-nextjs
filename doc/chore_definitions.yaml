# Chore Definitions
#
# Fields:
#   name: Display name (required)
#   recurrence: RRule string in iCalendar format (optional)
#   description: Additional details (optional)
#   category: Grouping category (optional)
#   autoSchedule: If true, automatically appears in sprint when due.
#                 If false (default), stays in backlog until manually scheduled.

